plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'lucky.hub.loader'
    compileSdk 34

    defaultConfig {
        applicationId 'LUCKY.HUB.LOADER'
        // Android 5.0 Lollipop (API 21) is the oldest supported release.
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // On-device UI translation with dynamically downloaded language models.
    implementation 'com.google.mlkit:translate:17.0.3'
}
