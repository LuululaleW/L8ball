apply plugin: 'com.android.application'

android {
    namespace 'com.eightballpool.bp'
    compileSdk 34
    ndkVersion '24.0.8215888'

    defaultConfig {
        applicationId 'com.eightballpool.bp'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1.0'

        // The hook engines (And64InlineHook) and the bundled curl/openssl
        // static libraries are 64-bit only.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the automatically generated debug key so the APK is
            // always installable. Replace with a private keystore before
            // distributing it.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    packaging {
        // Keep the .so extracted so it can be copied out and injected.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
